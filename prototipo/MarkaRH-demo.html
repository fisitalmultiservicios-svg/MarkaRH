text%20x%3D%2270%22%20y%3D%2254%22%20font-family%3D%22Arial%2Csans-serif%22%20letter-spacing%3D%222.1%22%20font-size%3D%228%22%20fill%3D%22%2362718b%22%3ECONTROL%20DE%20ASISTENCIA%3C%2Ftext%3E%3C%2Fsvg%3E%0A\" alt=\"MarkaRH Control de asistencia\">\u003c/a>\u003cnav class=\"links\" aria-label=\"Navegación principal\">\u003ca href=\"#funcionalidades\">Funcionalidades\u003c/a>\u003ca href=\"#como-funciona\">Cómo funciona\u003c/a>\u003ca href=\"#planes\">Planes\u003c/a>\u003ca href=\"#contacto\">Contacto\u003c/a>\u003ca class=\"btn secondary\" href=\"?page=admin\">Acceso empresas →\u003c/a>\u003c/nav>\u003c/header>\u003cmain>\u003csection class=\"hero\">\u003cdiv class=\"container hero-grid\">\u003cdiv>\u003cspan class=\"hero-badge\">\u003cspan class=\"dot\">\u003c/span> HECHO PARA EMPRESAS DE COSTA RICA\u003c/span>\u003ch1 id=\"hero-title\">Cada jornada cuenta.\u003cbr>\u003cspan>Cada persona, también.\u003c/span>\u003c/h1>\u003cp class=\"intro\" id=\"hero-description\">El control de asistencia que acompaña a tu equipo. Marca desde tu empresa, incluso sin internet, y administra todo desde un solo lugar.\u003c/p>\u003cdiv class=\"row wrap\">\u003ca href=\"#contacto\" class=\"btn\">Conversemos sobre tu empresa \u003cspan>→\u003c/span>\u003c/a>\u003ca href=\"#como-funciona\" class=\"btn secondary\">Así funciona \u003cspan>↓\u003c/span>\u003c/a>\u003c/div>\u003cp class=\"micro\">Windows y Android · Marcación offline · Administración web\u003c/p>\u003c/div>\u003cdiv class=\"hero-preview\" aria-label=\"Vista ilustrativa del marcador\">\u003cdiv class=\"preview-window\">\u003cdiv class=\"preview-top\">\u003cspan class=\"window-dot\">\u003c/span>\u003cspan class=\"window-dot\">\u003c/span>\u003cspan class=\"window-dot\">\u003c/span>\u003csmall style=\"margin:auto;font-size:9px\">MarkaRH · Terminal de asistencia\u003c/small>\u003cspan class=\"pill\" style=\"font-size:8px\">Autorizado\u003c/span>\u003c/div>\u003cdiv class=\"preview-content\">\u003cdiv class=\"row between\">\u003ch3>¡Buenos días, equipo!\u003c/h3>\u003cspan class=\"pill blue\" style=\"font-size:8px\">San José · 01\u003c/span>\u003c/div>\u003cdiv class=\"preview-time\">08:00\u003cspan style=\"font-size:17px;color:#adb9ca\">:24\u003c/span>\u003c/div>\u003csmall style=\"font-size:10px\">Todo listo para comenzar una nueva jornada.\u003c/small>\u003cdiv class=\"preview-person\">\u003cspan class=\"avatar\">AJ\u003c/span>\u003cdiv style=\"font-size:11px\">Ana Jiménez\u003csmall style=\"display:block;font-size:9px;margin-top:5px\">Identificación con PIN\u003c/small>\u003c/div>\u003cspan style=\"margin-left:auto;color:#8fa2ba\">⌄\u003c/span>\u003c/div>\u003cdiv class=\"preview-keys\" aria-hidden=\"true\">\u003cspan>1\u003c/span>\u003cspan>2\u003c/span>\u003cspan>3\u003c/span>\u003cspan>4\u003c/span>\u003cspan>5\u003c/span>\u003cspan>6\u003c/span>\u003cspan>7\u003c/span>\u003cspan>8\u003c/span>\u003cspan>9\u003c/span>\u003c/div>\u003cdiv style=\"background:#1465f5;color:white;text-align:center;padding:13px;margin-top:13px;border-radius:7px;font-size:10px\">→ &nbsp; Registrar entrada\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"float-card\">\u003cspan style=\"font-size:22px;color:#67e0be\">✓\u003c/span>\u003cdiv>\u003cb>La jornada sigue. Con o sin internet.\u003c/b>\u003csmall>Guardado local · Sincronización posterior\u003c/small>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003cdiv class=\"trust\">\u003cdiv class=\"container\">\u003cspan>Un sistema. Distintas formas de trabajar.\u003c/span>\u003cb>◈ &nbsp; Comercio\u003c/b>\u003cb>▥ &nbsp; Servicios\u003c/b>\u003cb>▣ &nbsp; Operaciones\u003c/b>\u003cb>◷ &nbsp; Equipos por turnos\u003c/b>\u003c/div>\u003c/div>\u003csection id=\"funcionalidades\" class=\"section\">\u003cdiv class=\"container\">\u003cdiv class=\"section-heading\">\u003cdiv class=\"eyebrow\">MENOS PROCESOS. MÁS CLARIDAD.\u003c/div>\u003ch2>Tu asistencia, en orden.\u003cbr>Tu atención, en las personas.\u003c/h2>\u003cp>De la primera entrada al último reporte, cada parte de la jornada tiene su lugar.\u003c/p>\u003c/div>\u003cdiv class=\"grid3\">\u003carticle class=\"feature\">\u003cspan class=\"icon\">↯\u003c/span>\u003ch3>Sin internet. Sin interrupciones.\u003c/h3>\u003cp>El marcador instalado conserva los registros localmente y los envía cuando vuelve la conexión.\u003c/p>\u003c/article>\u003carticle class=\"feature\">\u003cspan class=\"icon\">▤\u003c/span>\u003ch3>Una vista de todo tu equipo\u003c/h3>\u003cp>Personal, sucursales, turnos e incidencias en un panel que muestra la cobertura de los datos recibidos.\u003c/p>\u003c/article>\u003carticle class=\"feature\">\u003cspan class=\"icon\">◎\u003c/span>\u003ch3>Claridad en cada registro\u003c/h3>\u003cp>Consulta el origen y estado de cada marcación. Las correcciones conservan su motivo e historial.\u003c/p>\u003c/article>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"section soft-section\" id=\"como-funciona\">\u003cdiv class=\"container\">\u003cdiv class=\"section-heading\">\u003cdiv class=\"eyebrow\">SENCILLO DESDE EL PRIMER DÍA\u003c/div>\u003ch2>En tu empresa se marca.\u003cbr>Desde la web se administra.\u003c/h2>\u003c/div>\u003cdiv class=\"grid3\">\u003carticle class=\"step\">\u003cdiv class=\"number\">01 / CONFIGURA\u003c/div>\u003ch3>Prepara tu equipo\u003c/h3>\u003cp>Crea tu empresa, incorpora al personal y define las sucursales y los horarios.\u003c/p>\u003c/article>\u003carticle class=\"step\">\u003cdiv class=\"number\">02 / INSTALA\u003c/div>\u003ch3>Un marcador en tu sucursal\u003c/h3>\u003cp>Autoriza el equipo Windows o Android. Los empleados se identifican localmente con nombre y PIN.\u003c/p>\u003c/article>\u003carticle class=\"step\">\u003cdiv class=\"number\">03 / ADMINISTRA\u003c/div>\u003ch3>Toda la información, conectada\u003c/h3>\u003cp>Revisa los registros sincronizados, resuelve incidencias y exporta información para tu operación.\u003c/p>\u003c/article>\u003c/div>\u003c/div>\u003c/section>\u003csection id=\"planes\" class=\"section\">\u003cdiv class=\"container\">\u003cdiv class=\"section-heading\">\u003cdiv class=\"eyebrow\">CRECE A TU RITMO\u003c/div>\u003ch2>Un espacio para cada empresa.\u003c/h2>\u003cp>Planes ilustrativos para evaluar la experiencia. Precios y condiciones comerciales por definir.\u003c/p>\u003c/div>\u003cdiv class=\"grid3\">\u003carticle class=\"card price\">\u003ch3>Esencial\u003c/h3>\u003cp class=\"muted\">Tu primer paso hacia el orden.\u003c/p>\u003cdiv class=\"price-value\">Hablemos \u003csmall style=\"font-size:12px;font-weight:400\">/ cotización\u003c/small>\u003c/div>\u003cul>\u003cli>Hasta 25 empleados\u003c/li>\u003cli>1 sucursal · 1 marcador\u003c/li>\u003cli>Marcación local y reportes\u003c/li>\u003cli>Soporte de configuración\u003c/li>\u003c/ul>\u003cbutton class=\"btn secondary\" data-plan=\"Esencial\">Consultar este plan →\u003c/button>\u003c/article>\u003carticle class=\"card price featured\">\u003cspan class=\"pill blue\" style=\"position:absolute;right:22px;top:26px\">PARA CRECER\u003c/span>\u003ch3>Profesional\u003c/h3>\u003cp class=\"muted\">Conecta más personas y lugares.\u003c/p>\u003cdiv class=\"price-value\">A tu medida \u003csmall style=\"font-size:12px;font-weight:400\">/ cotización\u003c/small>\u003c/div>\u003cul>\u003cli>Hasta 100 empleados\u003c/li>\u003cli>3 sucursales · 5 marcadores\u003c/li>\u003cli>Turnos y gestión de incidencias\u003c/li>\u003cli>Reportes por sucursal\u003c/li>\u003c/ul>\u003cbutton class=\"btn\" data-plan=\"Profesional\">Consultar este plan →\u003c/button>\u003c/article>\u003carticle class=\"card price\">\u003ch3>Empresarial\u003c/h3>\u003cp class=\"muted\">Para operaciones con más alcance.\u003c/p>\u003cdiv class=\"price-value\">Conversemos\u003c/div>\u003cul>\u003cli>Capacidad según contrato\u003c/li>\u003cli>Dispositivos y sedes a medida\u003c/li>\u003cli>Permisos por equipo\u003c/li>\u003cli>Acompañamiento dedicado\u003c/li>\u003c/ul>\u003cbutton class=\"btn secondary\" data-plan=\"Empresarial\">Consultar este plan →\u003c/button>\u003c/article>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"section soft-section\" id=\"preguntas\">\u003cdiv class=\"container grid2\">\u003cdiv class=\"section-heading\">\u003cdiv class=\"eyebrow\">RESPUESTAS CLARAS\u003c/div>\u003ch2>Lo que necesitas saber.\u003c/h2>\u003cp>Una experiencia sencilla, con los límites claros desde el inicio.\u003c/p>\u003cbutton class=\"btn secondary\" id=\"downloads\">Descargas Windows y Android →\u003c/button>\u003c/div>\u003cdiv>\u003cdetails open>\u003csummary>¿Qué pasa si se pierde internet?\u003c/summary>\u003cp>La futura app instalada conservará las marcaciones en el equipo autorizado y las sincronizará al reconectarse. Este prototipo permite simular el flujo con almacenamiento del navegador.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>¿Mis empleados necesitan una cuenta web?\u003c/summary>\u003cp>No. Los empleados marcan exclusivamente en el equipo instalado. La web está reservada a administradores y al Maestro.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>¿Funciona con huella o fotografía?\u003c/summary>\u003cp>La fotografía será opcional. La identificación por huella requiere un lector externo y SDK compatibles, probados en cada plataforma. No están implementados en esta demo.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>¿Los reportes calculan mi planilla?\u003c/summary>\u003cp>Los reportes apoyan la revisión administrativa. Las reglas laborales y las estimaciones de pago necesitan validación profesional; no sustituyen una planilla legal.\u003c/p>\u003c/details>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"section\" id=\"contacto\">\u003cdiv class=\"container\">\u003cdiv class=\"cta\">\u003cdiv>\u003cdiv class=\"eyebrow\" style=\"color:#72b9ff\">HABLEMOS DE TU EQUIPO\u003c/div>\u003ch2>Más orden para tu empresa.\u003cbr>Más tiempo para lo que importa.\u003c/h2>\u003cp>Cuéntanos cómo trabajas y exploremos la mejor configuración.\u003c/p>\u003c/div>\u003cbutton class=\"btn\" id=\"contact-button\">Solicitar información →\u003c/button>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"public-footer\">\u003cdiv class=\"container\">\u003cdiv class=\"row between wrap\">\u003cimg class=\"brand\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22260%22%20height%3D%2270%22%20viewBox%3D%220%200%20260%2070%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22b%22%20x2%3D%22.8%22%20y2%3D%221%22%3E%3Cstop%20stop-color%3D%22%2300a9ff%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230951f5%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Cpath%20d%3D%22M13%2033a22%2022%200%200%201%2044%200%22%20fill%3D%22none%22%20stroke%3D%22url%28%23b%29%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M35%2016v18%22%20stroke%3D%22url%28%23b%29%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2235%22%20cy%3D%2235%22%20r%3D%225%22%20fill%3D%22%230878ff%22%2F%3E%3Ctext%20x%3D%2268%22%20y%3D%2238%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22800%22%20font-size%3D%2232%22%20fill%3D%22%230b2144%22%3EMarka%3Ctspan%20fill%3D%22%230878ff%22%3ERH%3C%2Ftspan%3E%3C%2Ftext%3E%3Ctext%20x%3D%2270%22%20y%3D%2254%22%20font-family%3D%22Arial%2Csans-serif%22%20letter-spacing%3D%222.1%22%20font-size%3D%228%22%20fill%3D%22%2362718b%22%3ECONTROL%20DE%20ASISTENCIA%3C%2Ftext%3E%3C%2Fsvg%3E%0A\" alt=\"MarkaRH\">\u003cdiv class=\"row wrap\">\u003ca href=\"#funcionalidades\">Funcionalidades\u003c/a>\u003cbutton class=\"btn ghost small\" id=\"privacy\">Privacidad\u003c/button>\u003cbutton class=\"btn ghost small\" id=\"terms\">Términos\u003c/button>\u003ca href=\"?page=admin\">Acceso empresas →\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"footer-bottom\">\u003cspan>© MarkaRH · Control de asistencia · Costa Rica\u003c/span>\u003cspan>Diseño de experiencia · Prototipo, no servicio en producción\u003c/span>\u003c/div>\u003c/div>\u003c/footer>\u003cscript>\n'use strict';\nwindow.MRH = (() => {\n const KEY='markarh-ux-v1';\n const date=new Date().toLocaleDateString('en-CA',{timeZone:'America/Costa_Rica'});\n const seed={employees:[{id:'E001',name:'Ana Jiménez',job:'Administración',branch:'San José',shift:'Diurno',active:true},{id:'E002',name:'Carlos Méndez',job:'Operaciones',branch:'San José',shift:'Diurno',active:true},{id:'E003',name:'Daniela Mora',job:'Ventas',branch:'San José',shift:'Mixto',active:true},{id:'E004',name:'Luis Vargas',job:'Logística',branch:'Heredia',shift:'Nocturno',active:true},{id:'E005',name:'María Solano',job:'Contabilidad',branch:'San José',shift:'Diurno',active:true},{id:'E006',name:'Pablo Rojas',job:'Operaciones',branch:'Heredia',shift:'Diurno',active:false}],events:[{id:'DEMO-001',employee:'E001',action:'Entrada',time:date+'T07:57:00-06:00',status:'Recibida',device:'SJ-01'},{id:'DEMO-002',employee:'E002',action:'Entrada',time:date+'T08:12:00-06:00',status:'Observada',device:'SJ-01'},{id:'DEMO-003',employee:'E003',action:'Entrada',time:date+'T08:00:00-06:00',status:'Recibida',device:'SJ-01'},{id:'DEMO-004',employee:'E005',action:'Entrada',time:date+'T07:55:00-06:00',status:'Recibida',device:'SJ-01'}],issues:[{id:'INC-001',employee:'E002',title:'Entrada fuera del horario',detail:'Entrada 08:12 · Jornada desde 08:00. Requiere revisión; no se aplican descuentos.',status:'Pendiente'},{id:'INC-002',employee:'E004',title:'Salida sin pareja',detail:'Turno nocturno con una salida sin entrada recibida. Verificar la cobertura de Heredia.',status:'Pendiente'}],leaves:[{id:'SOL-001',employee:'E003',type:'Vacaciones',start:date,end:date,reason:'Solicitud de demostración',status:'Pendiente'}],shifts:[{id:'T01',name:'Diurno',start:'08:00',end:'17:00',rest:'Continuo remunerado · 30 min',days:'Lunes a viernes'},{id:'T02',name:'Mixto',start:'14:00',end:'21:00',rest:'Continuo remunerado · 30 min',days:'Lunes a viernes'},{id:'T03',name:'Nocturno',start:'20:00',end:'02:00',rest:'Continuo remunerado · 30 min',days:'Lunes a sábado'}],branches:[{id:'S01',name:'San José',address:'Paseo Colón',timezone:'America/Costa_Rica'},{id:'S02',name:'Heredia',address:'Centro de Heredia',timezone:'America/Costa_Rica'}],devices:[{id:'SJ-01',name:'Recepción San José',branch:'San José',platform:'Windows',state:'Activo'},{id:'HE-01',name:'Acceso Heredia',branch:'Heredia',platform:'Android',state:'Activo'}],companies:[{id:'C01',name:'Multiservicios Central',plan:'Profesional',state:'Activa',employees:5,devices:2},{id:'C02',name:'Café Bosque',plan:'Esencial',state:'En gracia',employees:18,devices:1},{id:'C03',name:'Logística Horizonte',plan:'Empresarial',state:'Activa',employees:84,devices:5}],settings:{company:'Multiservicios Central',mode:'explicit',contrast:false,large:false},cms:{title:'Cada jornada cuenta. Cada persona, también.',description:'El control de asistencia que acompaña a tu equipo. Marca desde tu empresa, incluso sin internet, y administra todo desde un solo lugar.',accent:'#1465f5',published:null},cmsDraft:null,audit:[],contacts:[],lastSync:null,offline:false};\n let state;\n try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{state=structuredClone(seed)}\n let storageOK=true;\n const esc=v=>String(v??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n function save(next=state){try{localStorage.setItem(KEY,JSON.stringify(next));state=next;return true}catch{storageOK=false;toast('No se pudo guardar. El almacenamiento está lleno o no está disponible.');return false}}\n function transaction(fn){const next=structuredClone(state);fn(next);return save(next)}\n function audit(action,detail){return transaction(s=>s.audit.unshift({id:crypto.randomUUID(),time:new Date().toISOString(),action,detail,actor:sessionStorage.getItem('mrh-role')==='master'?'Maestro demo':'Administración demo'}))}\n const initials=name=>name.split(' ').map(w=>w[0]).slice(0,2).join('');\n const employee=id=>state.employees.find(e=>e.id===id);\n const time=iso=>new Date(iso).toLocaleTimeString('es-CR',{timeZone:'America/Costa_Rica',hour:'2-digit',minute:'2-digit',hour12:false});\n const day=iso=>new Date(iso).toLocaleDateString('es-CR',{timeZone:'America/Costa_Rica',day:'2-digit',month:'short',year:'numeric'});\n function pill(value){const cls=/Pendiente|Observada|gracia|Offline/.test(value)?'warn':/Inact|Suspend|Rechaz|Revoc/.test(value)?'gray':/Concil|Aprobad|Recibid|Activa|Activo/.test(value)?'':'blue';return `\u003cspan class=\"pill ${cls}\">${esc(value)}\u003c/span>`}\n function person(id){const e=employee(id)||{name:'Empleado no disponible',id};return `\u003cspan class=\"name-cell\">\u003cspan class=\"avatar\">${esc(initials(e.name))}\u003c/span>\u003cspan>\u003cb>${esc(e.name)}\u003c/b>\u003csmall>${esc(e.id)} · ${esc(e.job||'')}\u003c/small>\u003c/span>\u003c/span>`}\n function toast(message){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.role='status';t.textContent=message;document.body.append(t);setTimeout(()=>t.remove(),4500)}\n let returnFocus;\n function closeModal(){document.querySelector('.modal-backdrop')?.remove();returnFocus?.focus()}\n function modal(title,body,wide=false){closeModal();returnFocus=document.activeElement;const el=document.createElement('div');el.className='modal-backdrop';el.innerHTML=`\u003csection class=\"modal ${wide?'wide':''}\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title\">\u003cdiv class=\"card-head\">\u003ch2 id=\"modal-title\">${esc(title)}\u003c/h2>\u003cbutton class=\"close\" aria-label=\"Cerrar\">×\u003c/button>\u003c/div>${body}\u003c/section>`;document.body.append(el);el.querySelector('.close').onclick=closeModal;el.onclick=e=>{if(e.target===el)closeModal()};el.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'){const fields=[...el.querySelectorAll('button,a,input,select,textarea,[tabindex]')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!fields.length)return;if(e.shiftKey&&document.activeElement===fields[0]){e.preventDefault();fields.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===fields.at(-1)){e.preventDefault();fields[0].focus()}}});setTimeout(()=>el.querySelector('input,select,textarea,button')?.focus(),20);return el}\n function download(name,content,mime='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}\n function csv(rows){return '\\uFEFF'+rows.map(row=>row.map(v=>'\"'+String(v??'').replace(/^[=+@\\-\\t\\r]/,\"'$&\").replaceAll('\"','\"\"')+'\"').join(',')).join('\\r\\n')}\n function formField(label,name,value='',type='text',extra=''){return `\u003cdiv class=\"field\">\u003clabel for=\"f-${esc(name)}\">${esc(label)}\u003c/label>\u003cinput id=\"f-${esc(name)}\" name=\"${esc(name)}\" value=\"${esc(value)}\" type=\"${type}\" ${extra}>\u003c/div>`}\n function selectField(label,name,values,value=''){return `\u003cdiv class=\"field\">\u003clabel for=\"f-${esc(name)}\">${esc(label)}\u003c/label>\u003cselect id=\"f-${esc(name)}\" name=\"${esc(name)}\">${values.map(v=>`\u003coption ${v===value?'selected':''}>${esc(v)}\u003c/option>`).join('')}\u003c/select>\u003c/div>`}\n function applyPreferences(){document.body.classList.toggle('contrast',state.settings.contrast);document.body.classList.toggle('large-text',state.settings.large)}\n function preferences(){const m=modal('Accesibilidad',`\u003cp class=\"muted\">Ajusta el marcador para una lectura más cómoda.\u003c/p>\u003clabel class=\"checkbox\">\u003cinput id=\"contrast\" type=\"checkbox\" ${state.settings.contrast?'checked':''}> Alto contraste\u003c/label>\u003clabel class=\"checkbox\">\u003cinput id=\"large\" type=\"checkbox\" ${state.settings.large?'checked':''}> Texto ampliado\u003c/label>\u003cdiv class=\"modal-actions\">\u003cbutton class=\"btn\" id=\"save-access\">Guardar preferencias\u003c/button>\u003c/div>`);m.querySelector('#save-access').onclick=()=>{if(transaction(s=>{s.settings.contrast=m.querySelector('#contrast').checked;s.settings.large=m.querySelector('#large').checked})){applyPreferences();closeModal();toast('Preferencias guardadas')}}}\n function demoInfo(){modal('Sobre este prototipo',`\u003cp>Estas pantallas permiten evaluar la experiencia de MarkaRH con datos ficticios guardados en este navegador.\u003c/p>\u003cdiv class=\"notice\">No existe conexión a un servidor, autenticación real, cifrado local, captura biométrica ni cálculo de planilla certificado. La sincronización y los roles son simulaciones.\u003c/div>\u003cp class=\"muted\" style=\"margin-top:18px\">El marcador HTML representa la futura app instalada Windows/Android. No forma parte de la web pública del producto.\u003c/p>\u003cdiv class=\"modal-actions\">\u003cbutton class=\"btn secondary\" id=\"reset-demo\">Restablecer datos demo\u003c/button>\u003cbutton class=\"btn\" id=\"close-info\">Entendido\u003c/button>\u003c/div>`);document.querySelector('#close-info').onclick=closeModal;document.querySelector('#reset-demo').onclick=()=>{const m=modal('Restablecer demostración',`\u003cp>Se eliminarán solamente los datos de este prototipo en este navegador, incluidas las marcaciones de prueba. Esta operación no afecta ningún sistema real.\u003c/p>\u003cdiv class=\"modal-actions\">\u003cbutton class=\"btn secondary\" id=\"cancel-reset\">Cancelar\u003c/button>\u003cbutton class=\"btn danger\" id=\"confirm-reset\">Restablecer\u003c/button>\u003c/div>`);m.querySelector('#cancel-reset').onclick=closeModal;m.querySelector('#confirm-reset').onclick=()=>{if(save(structuredClone(seed)))location.reload()}}}\n document.addEventListener('click',e=>{if(e.target.closest('[data-demo-info]'))demoInfo()});\n window.addEventListener('storage',e=>{if(e.key===KEY){try{state=JSON.parse(e.newValue)||structuredClone(seed);window.dispatchEvent(new Event('mrh-update'))}catch{}}});\n \n return {get state(){return state},get storageOK(){return storageOK},save,transaction,audit,esc,initials,employee,time,day,pill,person,toast,modal,closeModal,download,csv,formField,selectField,applyPreferences,preferences,demoInfo,date};\n})();\n\n\u003c/script>\u003cscript>\n'use strict';\nconst {esc,modal,closeModal,formField,selectField,toast}=MRH;\nfunction applyCMS(){const c=MRH.state.cms;if(c.published){document.querySelector('#hero-title').textContent=c.title;document.querySelector('#hero-description').textContent=c.description;document.documentElement.style.setProperty('--blue',c.accent)}}\napplyCMS();window.addEventListener('mrh-update',applyCMS);\nfunction contact(plan='Por definir'){const m=modal('Conversemos sobre tu empresa',`\u003cp class=\"muted\">Demo: la solicitud se guarda en este navegador; no se envía a MarkaRH.\u003c/p>\u003cform id=\"contact-form\">${formField('Tu nombre','name','','text','required maxlength=\"80\"')}${formField('Correo empresarial','email','','email','required maxlength=\"120\"')}${formField('Empresa','company','','text','required maxlength=\"100\"')}${selectField('Plan de interés','plan',['Por definir','Esencial','Profesional','Empresarial'],plan)}\u003clabel class=\"checkbox\">\u003cinput type=\"checkbox\" required> Acepto guardar estos datos de prueba localmente. No incluiré información sensible.\u003c/label>\u003cdiv class=\"modal-actions\">\u003cbutton class=\"btn\" type=\"submit\">Guardar solicitud demo →\u003c/button>\u003c/div>\u003c/form>`);m.querySelector('form').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(MRH.transaction(s=>s.contacts.push({...data,id:crypto.randomUUID(),time:new Date().toISOString()}))){closeModal();toast('Solicitud demo guardada localmente. No se ha enviado ningún correo.')}}}\ndocument.querySelector('#contact-button').onclick=()=>contact();document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>contact(b.dataset.plan));\ndocument.querySelector('#downloads').onclick=()=>modal('Descargas de MarkaRH',`\u003cp class=\"muted\">Los instaladores se publicarán al completar y validar las aplicaciones nativas.\u003c/p>\u003cdiv class=\"grid2\">\u003cdiv class=\"card\">\u003cspan class=\"icon\">▦\u003c/span>\u003ch3 style=\"margin-top:20px\">Windows\u003c/h3>\u003cp class=\"muted\">Instalador firmado · En desarrollo\u003c/p>\u003cspan class=\"pill gray\">Aún no disponible\u003c/span>\u003c/div>\u003cdiv class=\"card\">\u003cspan class=\"icon\">◈\u003c/span>\u003ch3 style=\"margin-top:20px\">Android\u003c/h3>\u003cp class=\"muted\">APK firmada · En desarrollo\u003c/p>\u003cspan class=\"pill gray\">Aún no disponible\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"notice\" style=\"margin-top:20px\">Puedes explorar el diseño del marcador desde el acceso de demostración situado arriba del sitio.\u003c/div>`);\ndocument.querySelector('#privacy').onclick=()=>modal('Privacidad · Vista preliminar',`\u003cp>Este prototipo utiliza almacenamiento local del navegador para conservar exclusivamente la demostración. No transmite los datos a un servidor.\u003c/p>\u003cp>Usa nombres y datos ficticios. Puedes borrar los datos desde “Acerca de la demo”.\u003c/p>\u003cdiv class=\"notice\">Antes de producción deberán definirse responsable de tratamiento, finalidades, fundamento jurídico, retención y canales para ejercer derechos conforme a la Ley 8968. Este texto es una vista de diseño.\u003c/div>`);\ndocument.querySelector('#terms').onclick=()=>modal('Términos · Vista preliminar',`\u003cp>La demostración se entrega para evaluar la experiencia visual y los flujos de MarkaRH. No acredita asistencia laboral, no ofrece autenticación real y no genera cálculos legales.\u003c/p>\u003cp>Los planes y capacidades mostrados son ilustrativos. Los términos del servicio definitivo deberán publicarse antes de su contratación.\u003c/p>`);\n\n\u003c/script>\u003c/body>\u003c/html>\n", "marcador": "\u003c!doctype html>\u003chtml lang=\"es-CR\">\u003chead>\u0 3csmall>San José · Recepción · SJ-01\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"row kiosk-head-actions\">\u003cspan class=\"pill\" id=\"device-badge\">\u003cspan class=\"dot\">\u003c/span> Dispositivo demo autorizado\u003c/span>\u003cbutton class=\"btn ghost small\" id=\"technical\" aria-label=\"Opciones técnicas\">⚙ \u003cspan>Opciones\u003c/span>\u003c/button>\u003c/div>\u003c/header>\u003cmain class=\"kiosk-main\">\u003cdiv class=\"kiosk-heading\">\u003cdiv>\u003cdiv class=\"eyebrow\" style=\"margin-bottom:10px\">TU JORNADA COMIENZA AQUÍ\u003c/div>\u003ch1>Panel de marcación\u003c/h1>\u003cp>Selecciona tu nombre e ingresa tu PIN para continuar.\u003c/p>\u003c/div>\u003cbutton class=\"btn secondary small\" id=\"accessibility\">Aa &nbsp; Accesibilidad\u003c/button>\u003c/div>\u003cdiv class=\"kiosk-grid\">\u003csection class=\"clock-panel\" aria-label=\"Hora y estado del dispositivo\">\u003cdiv class=\"clock-caption\">Hora local · Costa Rica\u003c/div>\u003cdiv class=\"clock\">\u003cspan id=\"clock\">--:--\u003c/span>\u003cspan class=\"clock-seconds\" id=\"seconds\">:--\u003c/span>\u003c/div>\u003cdiv class=\"clock-date\" id=\"clock-date\">\u003c/div>\u003cdiv class=\"clock-policy\">\u003cdiv class=\"row\">\u003cspan style=\"color:#6fbcff\">◉\u003c/span>\u003cb>Una jornada, un paso a la vez.\u003c/b>\u003c/div>\u003cp>Tus marcaciones se guardan en este equipo, incluso cuando no hay conexión.\u003c/p>\u003cdiv style=\"border-top:1px solid #ffffff14;margin-top:25px;padding-top:22px\">\u003cspan class=\"clock-caption\">VERIFICACIÓN ACTIVA\u003c/span>\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cspan style=\"font-size:18px;color:#77baff\">▣\u003c/span> Identificación con PIN\u003c/div>\u003cp>No compartas tu PIN con otras personas.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"clock-bottom\">\u003cdiv class=\"row between\">\u003cspan id=\"connection-status\" class=\"pill\">● Conexión demo\u003c/span>\u003cspan id=\"pending-count\">0 pendientes\u003c/span>\u003c/div>\u003cdiv class=\"row between\">\u003cspan>Última sincronización demo\u003c/span>\u003cspan id=\"last-sync\">Sin ejecutar\u003c/span>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"card pin-panel\" id=\"punch-panel\" aria-label=\"Identificación y marcación de demostración\">\u003c/section>\u003caside class=\"kiosk-side\">\u003csection class=\"card guide-card\">\u003ch3>Así de sencillo.\u003c/h3>\u003cdiv class=\"guide-step\">\u003cspan class=\"num\">1\u003c/span>\u003cdiv>Busca tu nombre\u003csmall>Solo personal de esta sucursal.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"guide-step\">\u003cspan class=\"num\">2\u003c/span>\u003cdiv>Ingresa tu PIN\u003csmall>Usa el teclado o la pantalla táctil.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"guide-step\">\u003cspan class=\"num\">3\u003c/span>\u003cdiv>Registra tu marcación\u003csmall>Espera la confirmación antes de retirarte.\u003c/small>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"privacy-card\">\u003cspan style=\"font-size:21px;color:#5d7ca4\">♧\u003c/span>\u003cstrong>Tu información, protegida.\u003c/strong>En el producto final el equipo tendrá una identidad propia y almacenamiento cifrado. En esta demo se usa almacenamiento del navegador sin cifrar.\u003c/section>\u003c/aside>\u003c/div>\u003csection class=\"card recent\">\u003cdiv class=\"recent-title\">\u003cb>Actividad de este terminal\u003c/b>\u003cspan class=\"muted\" style=\"font-size:10px\">Identidad reducida · Últimos 3 eventos\u003c/span>\u003c/div>\u003cdiv id=\"recent-events\">\u003c/div>\u003c/section>\u003cfooter class=\"kiosk-foot\">\u003cspan>MarkaRH · Prototipo UX 1.0 · Terminal SJ-01\u003c/span>\u003cspan>Hora local, sin certificación del servidor · America/Costa_Rica\u003c/span>\u003c/footer>\u003c/main>\u003cscript>\n'use strict';\nwindow.MRH = (() => {\n const KEY='markarh-ux-v1';\n const date=new Date().toLocaleDateString('en-CA',{timeZone:'America/Costa_Rica'});\n const seed={employees:[{id:'E001',name:'Ana Jiménez',job:'Administración',branch:'San José',shift:'Diurno',active:true},{id:'E002',name:'Carlos Méndez',job:'Operaciones',branch:'San José',shift:'Diurno',active:true},{id:'E003',name:'Daniela Mora',job:'Ventas',branch:'San José',shift:'Mixto',active:true},{id:'E004',name:'Luis Vargas',job:'Logística',branch:'Heredia',shift:'Nocturno',active:true},{id:'E005',name:'María Solano',job:'Contabilidad',branch:'San José',shift:'Diurno',active:true},{id:'E006',name:'Pablo Rojas',job:'Operaciones',branch:'Heredia',shift:'Diurno',active:false}],events:[{id:'DEMO-001',employee:'E001',action:'Entrada',time:date+'T07:57:00-06:00',status:'Recibida',device:'SJ-01'},{id:'DEMO-002',employee:'E002',action:'Entrada',time:date+'T08:12:00-06:00',status:'Observada',device:'SJ-01'},{id:'DEMO-003',employee:'E003',action:'Entrada',time:date+'T08:00:00-06:00',status:'Recibida',device:'SJ-01'},{id:'DEMO-004',employee:'E005',action:'Entrada',time:date+'T07:55:00-06:00',status:'Recibida',device:'SJ-01'}],issues:[{id:'INC-001',employee:'E002',title:'Entrada fuera del horario',detail:'Entrada 08:12 · Jornada desde 08:00. Requiere revisión; no se aplican descuentos.',status:'Pendiente'},{id:'INC-002',employee:'E004',title:'Salida sin pareja',detail:'Turno nocturno con una salida sin entrada recibida. Verificar la cobertura de Heredia.',status:'Pendiente'}],leaves:[{id:'SOL-001',employee:'E003',type:'Vacaciones',start:date,end:date,reason:'Solicitud de demostración',status:'Pendiente'}],shifts:[{id:'T01',name:'Diurno',start:'08:00',end:'17:00',rest:'Continuo remunerado · 30 min',days:'Lunes a viernes'},{id:'T02',name:'Mixto',start:'14:00',end:'21:00',rest:'Continuo remunerado · 30 min',days:'Lunes a viernes'},{id:'T03',name:'Nocturno',start:'20:00',end:'02:00',rest:'Continuo remunerado · 30 min',days:'Lunes a sábado'}],branches:[{id:'S01',name:'San José',address:'Paseo Colón',timezone:'America/Costa_Rica'},{id:'S02',name:'Heredia',address:'Centro de Heredia',timezone:'America/Costa_Rica'}],devices:[{id:'SJ-01',name:'Recepción San José',branch:'San José',platform:'Windows',state:'Activo'},{id:'HE-01',name:'Acceso Heredia',branch:'Heredia',platform:'Android',state:'Activo'}],companies:[{id:'C01',name:'Multiservicios Central',plan:'Profesional',state:'Activa',employees:5,devices:2},{id:'C02',name:'Café Bosque',plan:'Esencial',state:'En gracia',employees:18,devices:1},{id:'C03',name:'Logística Horizonte',plan:'Empresarial',state:'Activa',employees:84,devices:5}],settings:{company:'Multiservicios Central',mode:'explicit',contrast:false,large:false},cms:{title:'Cada jornada cuenta. Cada persona, también.',description:'El control de asistencia que acompaña a tu equipo. Marca desde tu empresa, incluso sin internet, y administra todo desde un solo lugar.',accent:'#1465f5',published:null},cmsDraft:null,audit:[],contacts:[],lastSync:null,offline:false};\n let state;\n try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{state=structuredClone(seed)}\n let storageOK=true;\n const esc=v=>String(v??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n function save(next=state){try{localStorage.setItem(KEY,JSON.stringify(next));state=next;return true}catch{storageOK=false;toast('No se pudo guardar. El almacenamiento está lleno o no está disponible.');return false}}\n function transaction(fn){const next=structuredClone(state);fn(next);return save(next)}\n function audit(action,detail){return transaction(s=>s.audit.unshift({id:crypto.randomUUID(),time:new Date().toISOString(),action,detail,actor:sessionStorage.getItem('mrh-role')==='master'?'Maestro demo':'Administración demo'}))}\n const initials=name=>name.split(' ').map(w=>w[0]).slice(0,2).join('');\n const employee=id=>state.employees.find(e=>e.id===id);\n const time=iso=>new Date(iso).toLocaleTimeString('es-CR',{timeZone:'America/Costa_Rica',hour:'2-digit',minute:'2-digit',hour12:false});\n const day=iso=>new Date(iso).toLocaleDateString('es-CR',{timeZone:'America/Costa_Rica',day:'2-digit',month:'short',year:'numeric'});\n function pill(value){const cls=/Pendiente|Observada|gracia|Offline/.test(value)?'warn':/Inact|Suspend|Rechaz|Revoc/.test(value)?'gray':/Concil|Aprobad|Recibid|Activa|Activo/.test(value)?'':'blue';return `\u003cspan class=\"pill ${cls}\">${esc(value)}\u003c/span>`}\n function person(id){const e=employee(id)||{name:'Empleado no disponible',id};return `\u003cspan class=\"name-cell\">\u003cspan class=\"avatar\">${esc(initials(e.name))}\u003c/span>\u003cspan>\u003cb>${esc(e.name)}\u003c/b>\u003csmall>${esc(e.id)} · ${esc(e.job||'')}\u003c/small>\u003c/span>\u003c/span>`}\n function toast(message){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.role='status';t.textContent=message;document.body.append(t);setTimeout(()=>t.remove(),4500)}\n let returnFocus;\n function closeModal(){document.querySelector('.modal-backdrop')?.remove();returnFocus?.focus()}\n function modal(title,body,wide=false){closeModal();returnFocus=document.activeElement;const el=document.createElement('div');el.className='modal-backdrop';el.innerHTML=`\u003csection class=\"modal ${wide?'wide':''}\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title\">\u003cdiv class=\"card-head\">\u003ch2 id=\"modal-title\">${esc(title)}\u003c/h2>\u003cbutton class=\"close\" aria-label=\"Cerrar\">×\u003c/button>\u003c/div>${body}\u003c/section>`;document.body.append(el);el.querySelector('.close').onclick=closeModal;el.onclick=e=>{if(e.target===el)closeModal()};el.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'){const fields=[...el.querySelectorAll('button,a,input,select,textarea,[tabindex]')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!fields.length)return;if(e.shiftKey&&document.activeElement===fields[0]){e.preventDefault();fields.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===fields.at(-1)){e.preventDefault();fields[0].focus()}}});setTimeout(()=>el.querySelector('input,select,textarea,button')?.focus(),20);return el}\n function download(name,content,mime='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}\n function csv(rows){return '\\uFEFF'+rows.map(row=>row.map(v=>'\"'+String(v??'').replace(/^[=+@\\-\\t\\r]/,\"'$&\").replaceAll('\"','\"\"')+'\"').join(',')).join('\\r\\n')}\n function formField(label,name,value='',type='text',extra=''){return `\u003cdiv class=\"field\">\u003clabel for=\"f-${esc(name)}\">${esc(label)}\u003c/label>\u003cinput id=\"f-${esc(name)}\" name=\"${esc(name)}\" value=\"${esc(value)}\" type=\"${type}\" ${extra}>\u003c/div>`}\n function selectField(label,name,values,value=''){return `\u003cdiv class=\"field\">\u003clabel for=\"f-${esc(name)}\">${esc(label)}\u003c/label>\u003cselect id=\"f-${esc(name)}\" name=\"${esc(name)}\">${values.map(v=>`\u003coption ${v===value?'selected':''}>${esc(v)}\u003c/option>`).join('')}\u003c/select>\u003c/div>`}\n function applyPreferences(){document.body.classList.toggle('contrast',state.settings.contrast);document.body.classList.toggle('large-text',state.settings.large)}\n function preferences(){const m=modal('Accesibilidad',`\u003cp class=\"muted\">Ajusta el marcador para una lectura más cómoda.\u003c/p>\u003clabel class=\"checkbox\">\u003cinput id=\"contrast\" type=\"checkbox\" ${state.settings.contrast?'checked':''}> Alto contraste\u003c/label>\u003clabel class=\"checkbox\">\u003cinput id=\"large\" type=\"checkbox\" ${state.settings.large?'checked':''}> Texto ampliado\u003c/label>\u003cdiv class=\"modal-actions\">\u003cbutton class=\"btn\" id=\"save-access\">Guardar preferencias\u003c/button>\u003c/div>`);m.querySelector('#save-access').onclick=()=>{if(transaction(s=>{s.settings.contrast=m.querySelector('#contrast').checked;s.settings.large=m.querySelector('#large').checked})){applyPreferences();closeModal();toast('Preferencias guardadas')}}}\n function demoInfo(){modal('Sobre este prototipo',`\u003cp>Estas pantallas permiten evaluar la experiencia de MarkaRH con datos ficticios guardados en este navegador.\u003c/p>\u003cdiv class=\"notice\">No existe conexión a un servidor, autenticación real, cifrado local, captura biométrica ni cálculo de planilla certificado. La sincronización y los roles son simulaciones.\u003c/div>\u003cp class=\"muted\" style=\"margin-top:18px\">El marcador HTML representa la futura app instalada Windows/Android. No forma parte de la web pública del producto.\u003c/p>\u003cdiv class=\"modal-actions\">\u003cbutton class=\"btn secondary\" id=\"reset-demo\">Restablecer datos demo\u003c/button>\u003cbutton class=\"btn\" id=\"close-info\">Entendido\u003c/button>\u003c/div>`);document.querySelector('#close-info').onclick=closeModal;document.querySelector('#reset-demo').onclick=()=>{const m=modal('Restablecer demostración',`\u003cp>Se eliminarán solamente los datos de este prototipo en este navegador, incluidas las marcaciones de prueba. Esta operación no afecta ningún sistema real.\u003c/p>\u003cdiv class=\"modal-actions\">\u003cbutton class=\"btn secondary\" id=\"cancel-reset\">Cancelar\u003c/button>\u003cbutton class=\"btn danger\" id=\"confirm-reset\">Restablecer\u003c/button>\u003c/div>`);m.querySelector('#cancel-reset').onclick=closeModal;m.querySelector('#confirm-reset').onclick=()=>{if(save(structuredClone(seed)))location.reload()}}}\n document.addEventListener('click',e=>{if(e.target.closest('[data-demo-info]'))demoInfo()});\n window.addEventListener('storage',e=>{if(e.key===KEY){try{state=JSON.parse(e.newValue)||structuredClone(seed);window.dispatchEvent(new Event('mrh-update'))}catch{}}});\n \n return {get state(){return state},get storageOK(){return storageOK},save,transaction,audit,esc,initials,employee,time,day,pill,person,toast,modal,closeModal,download,csv,formField,selectField,applyPreferences,preferences,demoInfo,date};\n})();\n\n\u003c/script>\u003cscript>\n'use strict';\nconst {esc,toast,modal,closeModal}=MRH;\nlet selected='',pin='',action='Entrada',successTimer,resetTimer,renderedMode=MRH.state.settings.mode;\nconst panel=document.querySelector('#punch-panel');\nconst available=()=>MRH.state.employees.filter(e=>e.active&&e.branch==='San José');\nfunction form(){clearTimeout(successTimer);panel.innerHTML=`\u003cdiv class=\"step-label\">01 / IDENTIFÍCATE\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"employee-search\">Buscar empleado\u003c/label>\u003cinput id=\"employee-search\" type=\"search\" placeholder=\"Nombre o número interno\" autocomplete=\"off\">\u003c/div>\u003cdiv class=\"field\" style=\"margin-bottom:0\">\u003clabel for=\"employee-select\">Empleado de San José\u003c/label>\u003cselect id=\"employee-select\">\u003coption value=\"\">Selecciona tu nombre\u003c/option>${available().map(e=>`\u003coption value=\"${esc(e.id)}\">${esc(e.name)} · ${esc(e.id)}\u003c/option>`).join('')}\u003c/select>\u003c/div>\u003cdiv class=\"pin-display\">\u003cinput id=\"pin\" type=\"password\" inputmode=\"numeric\" maxlength=\"6\" autocomplete=\"off\" aria-label=\"PIN de seis dígitos\" placeholder=\"······\">\u003cspan style=\"font-size:10px;white-space:nowrap\">PIN · 6 dígitos\u003c/span>\u003c/div>\u003cdiv class=\"keypad\" aria-label=\"Teclado numérico\">${['1','2','3','4','5','6','7','8','9','Borrar','0','⌫'].map(k=>`\u003cbutton type=\"button\" class=\"key ${['Borrar','⌫'].includes(k)?'subtle':''}\" data-key=\"${k}\" aria-label=\"${k==='⌫'?'Eliminar último dígito':k}\">${k}\u003c/button>`).join('')}\u003c/div>\u003cdiv id=\"punch-types\" class=\"punch-types\" ${MRH.state.settings.mode==='auto'?'hidden':''}>${['Entrada','Salida','Inicio descanso','Fin descanso'].map(t=>`\u003cbutton class=\"punch-type ${action===t?'active':''}\" data-action=\"${t}\">${t==='Entrada'?'→':t==='Salida'?'←':'◷'} ${t}\u003c/button>`).join('')}\u003c/div>\u003cp class=\"error\" id=\"punch-error\" role=\"alert\" style=\"margin:9px 0 5px\">\u003c/p>\u003cbutton id=\"punch\" class=\"btn punch-button\">${MRH.state.settings.mode==='auto'?'◎ &nbsp; MARCAR AHORA':'→ &nbsp; Registrar '+action.toLowerCase()}\u003c/button>\u003csmall style=\"display:block;text-align:center;font-size:10px;margin-top:12px\">Demo: selecciona una persona y usa el PIN \u003cb>123456\u003c/b>.\u003c/small>`;\n selected='';pin='';\n const select=panel.querySelector('#employee-select');select.onchange=()=>{selected=select.value;pin='';panel.querySelector('#pin').value='';panel.querySelector('#punch-error').textContent='';scheduleReset()};\n panel.querySelector('#employee-search').oninput=e=>{const q=e.target.value.toLocaleLowerCase('es');select.innerHTML='\u003coption value=\"\">Selecciona tu nombre\u003c/option>'+available().filter(x=>(x.name+' '+x.id).toLocaleLowerCase('es').includes(q)).map(x=>`\u003coption value=\"${esc(x.id)}\">${esc(x.name)} · ${esc(x.id)}\u003c/option>`).join('');selected='';pin='';panel.querySelector('#pin').value='';scheduleReset()};\n panel.querySelector('#pin').oninput=e=>{pin=e.target.value.replace(/\\D/g,'').slice(0,6);e.target.value=pin;scheduleReset()};\n panel.querySelector('#pin').onkeydown=e=>{if(e.key==='Enter')punch()};\n panel.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{if(b.dataset.key==='Borrar')pin='';else if(b.dataset.key==='⌫')pin=pin.slice(0,-1);else pin=(pin+b.dataset.key).slice(0,6);panel.querySelector('#pin').value=pin;scheduleReset()});\n panel.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{action=b.dataset.action;panel.querySelectorAll('[data-action]').forEach(x=>x.classList.toggle('active',x===b));panel.querySelector('#punch').textContent='→ Registrar '+action.toLowerCase();scheduleReset()});\n panel.querySelector('#punch').onclick=()=>punch();\n panel.querySelector('#punch').disabled=MRH.state.devices.find(d=>d.id==='SJ-01')?.state==='Revocado';\n}\nfunction scheduleReset(){clearTimeout(resetTimer);resetTimer=setTimeout(()=>{form();toast('El formulario se limpió por inactividad.')},60000)}\nfunction punch(confirmed=false){\n if(MRH.state.devices.find(d=>d.id==='SJ-01')?.state==='Revocado')return toast('El terminal demo está revocado. Los registros anteriores se conservan.');\n const err=msg=>panel.querySelector('#punch-error').textContent=msg;\n const e=available().find(x=>x.id===selected);\n if(!e)return err('Selecciona tu nombre para continuar.');\n let attempts;try{attempts=JSON.parse(sessionStorage.getItem('mrh-attempts')||'{}')}catch{attempts={}}\n const a=attempts[e.id]||{count:0,until:0};if(a.until>Date.now())return err('Espera '+Math.ceil((a.until-Date.now())/1000)+' segundos antes de reintentar.');\n if(pin!=='123456'){a.count++;a.until=a.count>=3?Date.now()+Math.min(120000,15000*2**(a.count-3)):0;attempts[e.id]=a;sessionStorage.setItem('mrh-attempts',JSON.stringify(attempts));pin='';panel.querySelector('#pin').value='';return err(a.until?'Demasiados intentos. Espera 15 segundos; otras personas pueden marcar.':'PIN incorrecto. Para esta demo usa 123456.');}\n delete attempts[e.id];sessionStorage.setItem('mrh-attempts',JSON.stringify(attempts));\n const type=MRH.state.settings.mode==='auto'?'Registro automático':action;\n const last=MRH.state.events.filter(x=>x.employee===e.id).at(-1);\n const contradictory=last&&((Date.now()-new Date(last.time).getTime()\u003c60000)||(type===last.action&&type!=='Registro automático')||(type==='Salida'&&last.action==='Fin descanso'));\n if(contradictory&&!confirmed){const m=modal('Revisar secuencia',`\u003cp>Ya hay un registro reciente o una secuencia que requiere revisión. Puedes conservar una nueva evidencia sin borrar la anterior.\u003c/p>\u003cdiv class=\"notice warn\">La marcación se señalará como observada; no se interpretarán horas automáticamente.\u003c/div>\u003cdiv class=\"modal-actions\">\u003cbutton class=\"btn secondary\" id=\"cancel-duplicate\">Volver\u003c/button>\u003cbutton class=\"btn\" id=\"co :date+'T08:00:00-06:00',status:'Recibida',device:'SJ-01'},{id:'DEMO-004',employee:'E005',action:'Entrada',time:date+'T07:55:00-06:00',status:'Recibida',device:'SJ-01'}],issues:[{id:'INC-001',employee:'E002',title:'Entrada fuera del horario',detail:'Entrada 08:12 · Jornada desde 08:00. Requiere revisión; no se aplican descuentos.',status:'Pendiente'},{id:'INC-002',employee:'E004',title:'Salida sin pareja',detail:'Turno nocturno con una salida sin entrada recibida. Verificar la cobertura de Heredia.',status:'Pendiente'}],leaves:[{id:'SOL-001',employee:'E003',type:'Vacaciones',start:date,end:date,reason:'Solicitud de demostración',status:'Pendiente'}],shifts:[{id:'T01',name:'Diurno',start:'08:00',end:'17:00',rest:'Continuo remunerado · 30 min',days:'Lunes a viernes'},{id:'T02',name:'Mixto',start:'14:00',end:'21:00',rest:'Continuo remunerado · 30 min',days:'Lunes a viernes'},{id:'T03',name:'Nocturno',start:'20:00',end:'02:00',rest:'Continuo remunerado · 30 min',days:'Lunes a sábado'}],branches:[{id:'S01',name:'San José',address:'Paseo Colón',timezone:'America/Costa_Rica'},{id:'S02',name:'Heredia',address:'Centro de Heredia',timezone:'America/Costa_Rica'}],devices:[{id:'SJ-01',name:'Recepción San José',branch:'San José',platform:'Windows',state:'Activo'},{id:'HE-01',name:'Acceso Heredia',branch:'Heredia',platform:'Android',state:'Activo'}],companies:[{id:'C01',name:'Multiservicios Central',plan:'Profesional',state:'Activa',employees:5,devices:2},{id:'C02',name:'Café Bosque',plan:'Esencial',state:'En gracia',employees:18,devices:1},{id:'C03',name:'Logística Horizonte',plan:'Empresarial',state:'Activa',employees:84,devices:5}],settings:{company:'Multiservicios Central',mode:'explicit',contrast:false,large:false},cms:{title:'Cada jornada cuenta. Cada persona, también.',description:'El control de asistencia que acompaña a tu equipo. Marca desde tu empresa, incluso sin internet, y administra todo desde un solo lugar.',accent:'#1465f5',published:null},cmsDraft:null,audit:[],contacts:[],lastSync:null,offline:false};\n let state;\n try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{state=structuredClone(seed)}\n let storageOK=true;\n const esc=v=>String(v??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n function save(next=state){try{localStorage.setItem(KEY,JSON.stringify(next));state=next;return true}catch{storageOK=false;toast('No se pudo guardar. El almacenamiento está lleno o no está disponible.');return false}}\n function transaction(fn){const next=structuredClone(state);fn(next);return save(next)}\n function audit(action,detail){return transaction(s=>s.audit.unshift({id:crypto.randomUUID(),time:new Date().toISOString(),action,detail,actor:sessionStorage.getItem('mrh-role')==='master'?'Maestro demo':'Administración demo'}))}\n const initials=name=>name.split(' ').map(w=>w[0]).slice(0,2).join('');\n const employee=id=>state.employees.find(e=>e.id===id);\n const time=iso=>new Date(iso).toLocaleTimeString('es-CR',{timeZone:'America/Costa_Rica',hour:'2-digit',minute:'2-digit',hour12:false});\n const day=iso=>new Date(iso).toLocaleDateString('es-CR',{timeZone:'America/Costa_Rica',day:'2-digit',month:'short',year:'numeric'});\n function pill(value){const cls=/Pendiente|Observada|gracia|Offline/.test(value)?'warn':/Inact|Suspend|Rechaz|Revoc/.test(value)?'gray':/Concil|Aprobad|Recibid|Activa|Activo/.test(value)?'':'blue';return `\u003cspan class=\"pill ${cls}\">${esc(value)}\u003c/span>`}\n function person(id){const e=employee(id)||{name:'Empleado no disponible',id};return `\u003cspan class=\"name-cell\">\u003cspan class=\"avatar\">${esc(initials(e.name))}\u003c/span>\u003cspan>\u003cb>${esc(e.name)}\u003c/b>\u003csmall>${esc(e.id)} · ${esc(e.job||'')}\u003c/small>\u003c/span>\u003c/span>`}\n function toast(message){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.role='status';t.textContent=message;document.body.append(t);setTimeout(()=>t.remove(),4500)}\n let returnFocus;\n function closeModal(){document.querySelector('.modal-backdrop')?.remove();returnFocus?.focus()}\n function modal(title,body,wide=false){closeModal();returnFocus=document.activeElement;const el=document.createElement('div');el.className='modal-backdrop';el.innerHTML=`\u003csection class=\"modal ${wide?'wide':''}\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title\">\u003cdiv class=\"card-head\">\u003ch2 id=\"modal-title\">${esc(title)}\u003c/h2>\u003cbutton class=\"close\" aria-label=\"Cerrar\">×\u003c/button>\u003c/div>${body}\u003c/section>`;document.body.append(el);el.querySelector('.close').onclick=closeModal;el.onclick=e=>{if(e.target===el)closeModal()};el.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'){const fields=[...el.querySelectorAll('button,a,input,select,textarea,[tabindex]')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!fields.length)return;if(e.shiftKey&&document.activeElement===fields[0]){e.preventDefault();fields.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===fields.at(-1)){e.preventDefault();fields[0].focus()}}});setTimeout(()=>el.querySelector('input,select,textarea,button')?.focus(),20);return el}\n function download(name,content,mime='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}\n function csv(rows){return '\\uFEFF'+rows.map(row=>row.map(v=>'\"'+String(v??'').replace(/^[=+@\\-\\t\\r]/,\"'$&\").replaceAll('\"','\"\"')+'\"').join(',')).join('\\r\\n')}\n function formField(label,name,value='',type='text',extra=''){return `\u003cdiv class=\"field\">\u003clabel for=\"f-${esc(name)}\">${esc(label)}\u003c/label>\u003cinput id=\"f-${esc(name)}\" name=\"${esc(name)}\" value=\"${esc(value)}\" type=\"${type}\" ${extra}>\u003c/div>`}\n function selectField(label,name,values,value=''){return `\u003cdiv class=\"field\">\u003clabel for=\"f-${esc(name)}\">${esc(label)}\u003c/label>\u003cselect id=\"f-${esc(name)}\" name=\"${esc(name)}\">${values.map(v=>`\u003coption ${v===value?'selected':''}>${esc(v)}\u003c/option>`).join('')}\u003c/select>\u003c/div>`}\n function applyPreferences(){document.body.classList.toggle('contrast',state.settings.contrast);document.body.classList.toggle('large-text',state.settings.large)}\n function preferences(){const m=modal('Accesibilidad',`\u003cp class=\"muted\">Ajusta el marcador para una lectura más cómoda.\u003c/p>\u003clabel class=\"checkbox\">\u003cinput id=\"contrast\" type=\"checkbox\" ${state.settings.contrast?'checked':''}> Alto contraste\u003c/label>\u003clabel class=\"checkbox\">\u003cinput id=\"large\" type=\"checkbox\" ${state.settings.large?'checked':''}> Texto ampliado\u003c/label>\u003cdiv class=\"modal-actions\">\u003cbutton class=\"btn\" id=\"save-access\">Guardar preferencias\u003c/button>\u003c/div>`);m.querySelector('#save-access').onclick=()=>{if(transaction(s=>{s.settings.contrast=m.querySelector('#contrast').checked;s.settings.large=m.querySelector('#large').checked})){applyPreferences();closeModal();toast('Preferencias guardadas')}}}\n function demoInfo(){modal('Sobre este prototipo',`\u003cp>Estas pantallas permiten evaluar la experiencia de MarkaRH con datos ficticios guardados en este navegador.\u003c/p>\u003cdiv class=\"notice\">No existe conexión a un servidor, autenticación real, cifrado local, captura biométrica ni cálculo de planilla certificado. La sincronización y los roles son simulaciones.\u003c/div>\u003cp class=\"muted\" style=\"margin-top:18px\">El marcador HTML representa la futura app instalada Windows/Android. No forma parte de la web pública del producto.\u003c/p>\u003cdiv class=\"modal-actions\">\u003cbutton class=\"btn secondary\" id=\"reset-demo\">Restablecer datos demo\u003c/button>\u003cbutton class=\"btn\" id=\"close-info\">Entendido\u003c/button>\u003c/div>`);document.querySelector('#close-info').onclick=closeModal;document.querySelector('#reset-demo').onclick=()=>{const m=modal('Restablecer demostración',`\u003cp>Se eliminarán solamente los datos de este prototipo en este navegador, incluidas las marcaciones de prueba. Esta operación no afecta ningún sistema real.\u003c/p>\u003cdiv class=\"modal-actions\">\u003cbutton class=\"btn secondary\" id=\"cancel-reset\">Cancelar\u003c/button>\u003cbutton class=\"btn danger\" id=\"confirm-reset\">Restablecer\u003c/button>\u003c/div>`);m.querySelector('#cancel-reset').onclick=closeModal;m.querySelector('#confirm-reset').onclick=()=>{if(save(structuredClone(seed)))location.reload()}}}\n document.addEventListener('click',e=>{if(e.target.closest('[data-demo-info]'))demoInfo()});\n window.addEventListener('storage',e=>{if(e.key===KEY){try{state=JSON.parse(e.newValue)||structuredClone(seed);window.dispatchEvent(new Event('mrh-update'))}catch{}}});\n \n return {get state(){return state},get storageOK(){return storageOK},save,transaction,audit,esc,initials,employee,time,day,pill,person,toast,modal,closeModal,download,csv,formField,selectField,applyPreferences,preferences,demoInfo,date};\n})();\n\n\u003c/script>\u003cscript>\n'use strict';\nconst {esc,person,pill,toast,modal,closeModal,formField:F,selectField:S}=MRH;\nlet role=sessionStorage.getItem('mrh-role'),view=location.hash.slice(1)||'resumen';\nconst app=document.querySelector('#app');\nconst items=[['resumen','◫','Vista general'],['empleados','♙','Empleados'],['marcaciones','◷','Marcaciones'],['incidencias','⚑','Incidencias'],['turnos','▦','Turnos y jornadas'],['solicitudes','◇','Permisos y vacaciones'],['horas-extra','◴','Horas extra'],['preplanilla','▧','Preplanilla'],['reportes','▤','Reportes'],['dispositivos','▣','Dispositivos'],['empresa','◈','Empresa y sucursales'],['bitacora','≡','Bitácora']];\nconst masterItems=[['global','◫','Vista global'],['empresas','▥','Empresas y licencias'],['sitio','◈','Editor web pública'],['consultas','◇','Solicitudes comerciales'],['bitacora','≡','Auditoría global']];\nconst title=()=>[...items,...masterItems].find(x=>x[0]===view)?.[2]||'Vista general';\nconst nav=()=>role==='master'?masterItems:items;\nfunction login(){app.innerHTML=`\u003cdiv class=\"demo-bar\">EXPERIENCIA DE DEMOSTRACIÓN · El acceso simula roles; no autentica usuarios \u003ca href=\"?page=web\">Volver a la web oficial\u003c/a>\u003c/div>\u003cmain class=\"login-page\">\u003csection class=\"login-story\">\u003cdiv class=\"eyebrow\" style=\"color:#79b6ff\">EL ESPACIO DE TU EMPRESA\u003c/div>\u003ch1>Tu equipo, conectado.\u003cbr>Tu operación, en orden.\u003c/h1>\u003cp>Una sola vista para entender cada jornada, acompañar a tu personal y tomar decisiones con claridad.\u003c/p>\u003cdiv style=\"border-top:1px solid #ffffff22;margin-top:35px;padding-top:30px\">\u003cspan class=\"pill\" style=\"background:#173f50;color:#79d9bd\">● Administración, sin marcación web\u003c/span>\u003cp style=\"font-size:12px;margin-top:20px\">La asistencia se registra únicamente en las terminales instaladas de tu empresa.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"login-form-wrap\">\u003cdiv class=\"login-form\">\u003ca href=\"?page=web\">\u003cimg class=\"brand\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22260%22%20height%3D%2270%22%20viewBox%3D%220%200%20260%2070%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22b%22%20x2%3D%22.8%22%20y2%3D%221%22%3E%3Cstop%20stop-color%3D%22%2300a9ff%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230951f5%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Cpath%20d%3D%22M13%2033a22%2022%200%200%201%2044%200%22%20fill%3D%22none%22%20stroke%3D%22url%28%23b%29%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M35%2016v18%22%20stroke%3D%22url%28%23b%29%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2235%22%20cy%3D%2235%22%20r%3D%225%22%20fill%3D%22%230878ff%22%2F%3E%3Ctext%20x%3D%2268%22%20y%3D%2238%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22800%22%20font-size%3D%2232%22%20fill%3D%22%230b2144%22%3EMarka%3Ctspan%20fill%3D%22%230878ff%22%3ERH%3C%2Ftspan%3E%3C%2Ftext%3E%3Ctext%20x%3D%2270%22%20y%3D%2254%22%20font-family%3D%22Arial%2Csans-serif%22%20letter-spacing%3D%222.1%22%20font-size%3D%228%22%20fill%3D%22%2362718b%22%3ECONTROL%20DE%20ASISTENCIA%3C%2Ftext%3E%3C%2Fsvg%3E%0A\" alt=\"MarkaRH\">\u003c/a>\u003ch2>Bienvenido a tu espacio.\u003c/h2>\u003cp>Explora el panel con una sesión de demostración.\u003c/p>\u003cdiv class=\"login-role\">\u003cbutton class=\"active\" data-role=\"company\">Administrador de empresa\u003c/button>\u003cbutton data-role=\"master\">Maestro MarkaRH\u003c/button>\u003c/div>\u003cdiv class=\"notice\" id=\"role-description\">Gestiona empleados, horarios y reportes de Multiservicios Central. Todos los datos son ficticios.\u003c/div>\u003clabel class=\"checkbox\">\u003cinput type=\"checkbox\" id=\"demo-consent\"> Entiendo que este es un prototipo con datos locales y que no debo ingresar información real.\u003c/label>\u003cp class=\"error\" id=\"login-error\" role=\"alert\">\u003c/p>\u003cbutton class=\"btn\" style=\"width:100%\" id=\"enter-demo\">Entrar a la demo →\u003c/button>\u003cp style=\"font-size:10px;margin-top:22px\">El producto final tendrá autenticación segura, permisos por empresa y MFA obligatorio para Maestro.\u003c/p>\u003c/div>\u003c/section>\u003c/main>`;let selectedRole='company';app.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{selectedRole=b.dataset.role;app.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('active',x===b));app.querySelector('#role-description').textContent=selectedRole==='master'?'Gestiona empresas y licencias, revisa solicitudes comerciales y edita el sitio público. No se accede a datos laborales de otros negocios.':'Gestiona empleados, horarios y reportes de Multiservicios Central. Todos los datos son ficticios.'});app.querySelector('#enter-demo').onclick=()=>{if(!app.querySelector('#demo-consent').checked){app.querySelector('#login-error').textContent='Confirma que entiendes el alcance de esta demostración.';return}role=selectedRole;sessionStorage.setItem('mrh-role',role);view=role==='master'?'global':'resumen';location.hash=view;MRH.audit('Acceso demo',role==='master'?'Vista Maestro':'Vista empresa');shell()}}\nfunction shell(){if(!role)return login();if(!nav().some(x=>x[0]===view))view=nav()[0][0];app.innerHTML=`\u003cdiv class=\"app-shell\">\u003caside class=\"sidebar\" id=\"sidebar\">\u003ca href=\"?page=web\">\u003cimg class=\"brand\" src=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22260%22%20height%3D%2270%22%20viewBox%3D%220%200%20260%2070%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22b%22%20x2%3D%22.8%22%20y2%3D%221%22%3E%3Cstop%20stop-color%3D%22%2300a9ff%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230951f5%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Cpath%20d%3D%22M13%2033a22%2022%200%200%201%2044%200%22%20fill%3D%22none%22%20stroke%3D%22url%28%23b%29%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M35%2016v18%22%20stroke%3D%22url%28%23b%29%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2235%22%20cy%3D%2235%22%20r%3D%225%22%20fill%3D%22%230878ff%22%2F%3E%3Ctext%20x%3D%2268%22%20y%3D%2238%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22800%22%20font-size%3D%2232%22%20fill%3D%22%230b2144%22%3EMarka%3Ctspan%20fill%3D%22%230878ff%22%3ERH%3C%2Ftspan%3E%3C%2Ftext%3E%3Ctext%20x%3D%2270%22%20y%3D%2254%22%20font-family%3D%22Arial%2Csans-serif%22%20letter-spacing%3D%222.1%22%20font-size%3D%228%22%20fill%3D%22%2362718b%22%3ECONTROL%20DE%20ASISTENCIA%3C%2Ftext%3E%3C%2Fsvg%3E%0A\" alt=\"MarkaRH\">\u003c/a>\u003cdiv class=\"workspace-tag\">\u003cspan class=\"avatar\" style=\"background:#26476e;color:white\">${role==='master'?'M':'MC'}\u003c/span>\u003cdiv>${role==='master'?'Espacio Maestro':esc(MRH.state.settings.company)}\u003csmall>${role==='master'?'Administración global':'Plan Profesional · Demo'}\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"nav-label\">${role==='master'?'PLATAFORMA':'ESPACIO DE TRABAJO'}\u003c/div>\u003cnav class=\"side-nav\" aria-label=\"Módulos administrativos\">${nav().map(([id,icon,label])=>`\u003ca class=\"nav-item ${view===id?'active':''}\" href=\"#${id}\" ${view===id?'aria-current=\"page\"':''}>\u003cspan class=\"nav-symbol\" aria-hidden=\"true\">${icon}\u003c/span>${label}${id==='incidencias'?`\u003cspan style=\"margin-left:auto;font-size:9px;background:#314d71;padding:3px 5px;border-radius:4px\">${MRH.state.issues.filter(i=>i.status==='Pendiente').length}\u003c/span>`:''}\u003c/a>`).join('')}\u003c/nav>\u003cdiv class=\"side-foot\">\u003cdiv class=\"side-help\">\u003cb>Un espacio para explorar.\u003c/b>\u003cbr>Datos ficticios, cambios locales.\u003cbr>\u003cbutton data-demo-info style=\"background:none;color:#75b8ff;padding:7px 0 0;font-size:11px\">Ver alcance de la demo →\u003c/button>\u003c/div>\u003ca class=\"nav-item\" href=\"?page=web\">\u003cspan class=\"nav-symbol\">→\u003c/span> Ir a web oficial\u003c/a>\u003cbutton class=\"nav-item\" id=\"switch-role\">\u003cspan class=\"nav-symbol\">⇄\u003c/span> Cambiar vista demo\u003c/button>\u003cbutton class=\"nav-item\" id=\"logout\">\u003cspan class=\"nav-symbol\">↪\u003c/span> Cerrar sesión demo\u003c/button>\u003c/div>\u003c/aside>\u003cdiv class=\"app-body\">\u003cheader class=\"topbar\">\u003cdiv class=\"row\">\u003cbutton class=\"mobile-menu\" id=\"mobile-menu\" aria-label=\"Abrir menú\" aria-expanded=\"false\">☰\u003c/button>\u003cdiv class=\"breadcrumb\">${role==='master'?'Plataforma MarkaRH':'Mi empresa'} &nbsp; / &nbsp; \u003cstrong>${esc(title())}\u003c/strong>\u003c/div>\u003c/div>\u003cdiv class=\"row\">\u003cspan class=\"pill blue\">${role==='master'?'Maestro':'Empresa'} · Demo\u003c/span>\u003cbutton class=\"btn ghost small\" id=\"notifications\" aria-label=\"Ver notificaciones\">♧\u003c/button>\u003cspan class=\"separator\">\u003c/span>\u003cspan class=\"avatar\" style=\"background:#e9edfa\">${role==='master'?'MA':'AS'}\u003c/span>\u003cdiv class=\"profile-name\">${role==='master'?'Maestro MarkaRH':'Andrea Solís'}\u003csmall>${role==='master'?'Administración global':'Administradora de empresa'}\u003c/small>\u003c/div>\u003c/div>\u003c/header>\u003cdiv class=\"demo-bar\">PROTOTIPO INTERACTIVO · Datos almacenados solo en este navegador · No es un sistema en producción\u003c/div>\u003cmain class=\"content\" id=\"content\">\u003c/main>\u003c/div>\u003c/div>`;app.querySelector('#logout').onclick=()=>{sessionStorage.removeItem('mrh-role');role=null;location.hash='';login()};app.querySelector('#switch-role').onclick=()=>{role=role==='master'?'company':'master';sessionStorage.setItem('mrh-role',role);view=nav()[0][0];location.hash=view;shell()};app.querySelector('#mobile-menu').onclick=()=>{const open=app.querySelector('#sidebar').classList.toggle('open');app.querySelector('#mobile-menu').setAttribute('aria-expanded',String(open));app.querySelector('#mobile-menu').setAttribute('aria-label',open?'Cerrar menú':'Abrir menú')};app.querySelector('#notifications').onclick=notifications;render()}\nfunction head(sub,actions=''){return `\u003cdiv class=\"page-head\">\u003cdiv>\u003ch1>${esc(title())}\u003c/h1>\u003cp>${sub}\u003c/p>\u003c/div>\u003cdiv class=\"row wrap\">${actions}\u003c/div>\u003c/div>`}\nfunction footer(){return `\u003cfooter class=\"page-footer\">\u003cspan>MarkaRH · ${role==='master'?'Plataforma global':esc(MRH.state.settings.company)} · Demostración\u003c/span>\u003cspan>Zona horaria: Costa Rica (UTC−6)\u003c/span>\u003c/footer>`}\nfunction stat(label,value,note,icon='◫',warn=false){return `\u003cdiv class=\"stat\">\u003cdiv class=\"stat-top\">${label}\u003cspan class=\"icon\" ${warn?'style=\"background:#fff5e5;color:#b68b3c\"':''}>${icon}\u003c/span>\u003c/div>\u003cdiv class=\"stat-value\">${value}\u003c/div>\u003csmall ${warn?'style=\"color:#b28c45\"':''}>${note}\u003c/small>\u003c/div>`}\nfunction table(headers,rows){return `\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>${headers.map(h=>`\u003cth>${h}\u003c/th>`).join('')}\u003c/tr>\u003c/thead>\u003ctbody>${rows||`\u003ctr>\u003ctd colspan=\"${headers.length}\" class=\"empty\">No hay resultados con estos filtros.\u003c/td>\u003c/tr>`}\u003c/tbody>\u003c/table>\u003c/div>`}\nfunction buttonsSave(text='Guardar'){return `\u003cdiv class=\"modal-actions\">\u003cbutton class=\"btn secondary\" type=\"button\" data-cancel>Cancelar\u003c/button>\u003cbutton class=\"btn\" type=\"submit\">${text}\u003c/button>\u003c/div>`}\nfunction wireCancel(m){m.querySelector('[data-cancel]')?.addEventListener('click',closeModal)}\nfunction render(){const c=document.querySelector('#content');if(!c)return;const screens={resumen:dashboard,empleados:employees,marcaciones:attendance,incidencias:issues,turnos:shifts,solicitudes:leaves,'horas-extra':overtime,preplanilla:prepay,reportes:reports,dispositivos:devices,empresa:company,bitacora:audit,global:globalDashboard,empresas:companies,sitio:cms,consultas:contacts};(screens[view]||dashboard)(c);c.insertAdjacentHTML('beforeend',footer());document.title=`${title()} · MarkaRH`}\nfunction dashboard(c){const s=MRH.state,received=s.events.filter(e=>e.status!=='Pendiente'),present=new Set(received.filter(e=>e.action==='Entrada').map(e=>e.employee)).size,pending=s.issues.filter(i=>i.status==='Pendiente').length; c.innerHTML=head('Una vista clara de tu equipo. '+MRH.day(new Date().toISOString())+' · San José, Costa Rica',`\u003ca class=\"btn secondary\" href=\"#reportes\">→ Ver reportes\u003c/a>`)+`\u003cdiv class=\"notice\">◎ &nbsp; Cobertura parcial: solo se muestran eventos recibidos en la simulación. No se infiere ausencia por falta de sincronización.\u003c/div>\u003cdiv class=\"stats\">${stat('Personal activo',s.employees.filter(e=>e.active).length,'En las sucursales de la empresa','♙')}${stat('Entradas recibidas',present,'Personas con entrada · No presencia en vivo','→')}${stat('Por revisar',pending,'Incidencias pendientes de resolución','⚑',true)}${stat('Dispositivos',s.devices.length,'Última recepción visible por terminal','▣')}\u003c/div>\u003cdiv class=\"dashboard-grid\">\u003csection class=\"card\">\u003cdiv class=\"card-head\">\u003cdiv>\u003ch3>Una semana de jornadas\u003c/h3>\u003csmall>Comparativo ilustrativo · No derivado de registros\u003c/small>\u003c/div>\u003cspan class=\"pill blue\">Demo\u003c/span>\u003c/div>\u003cdiv class=\"legend\">\u003cspan>\u003ci>\u003c/i>Entradas\u003c/span>\u003cspan>\u003ci class=\"pale\">\u003c/i>Personal planificado\u003c/span>\u003c/div>\u003cdiv class=\"chart\" role=\"img\" aria-label=\"Gráfico ilustrativo: entradas de lunes a viernes 4, 5, 4, 5 y 4; cinco planificados cada día\">${[75,92,78,88,80].map(h=>`\u003cdiv class=\"chart-group\">\u003cdiv class=\"chart-bar\" style=\"height:${h}%\">\u003c/div>\u003cdiv class=\"chart-bar pale\" style=\"height:95%\">\u003c/div>\u003c/div>`).join('')}\u003c/div>\u003cdiv class=\"chart-labels\">\u003cspan>Lun\u003c/span>\u003cspan>Mar\u003c/span>\u003cspan>Mié\u003c/span>\u003cspan>Jue\u003c/span>\u003cspan>Vie\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"card\">\u003cdiv class=\"card-head\">\u003ch3>Tus terminales\u003c/h3>\u003ca href=\"#dispositivos\" style=\"font-size:11px;color:var(--blue)\">Ver todas →\u003c/a>\u003c/div>${s.devices.map(d=>`\u003cdiv class=\"device-row\">\u003cdiv class=\"row\">\u003cspan class=\"icon\" style=\"width:30px;height:30px;font-size:14px\">${d.platform==='Windows'?'▦':'▯'}\u003c/span>\u003cdiv>\u003cb>${esc(d.name)}\u003c/b>\u003csmall>${esc(d.platform)} · ${esc(d.id)}\u003c/small>\u003csmall>Recepción demo: ${d.id==='SJ-01'&&s.lastSync?MRH.time(s.lastSync):'Sin sincronización ejecutada'}\u003c/small>\u003c/div>\u003c/div>${pill(d.state)}\u003c/div>`).join('')}\u003cdiv class=\"notice\" style=\"margin-top:17px;font-size:10px\">Los equipos desconectados pueden tener datos pendientes que aún no aparecen aquí.\u003c/div>\u003c/section>\u003c/div>\u003csection class=\"card\" style=\"margin-bottom:22px\">\u003cdiv class=\"card-head\">\u003cdiv>\u003ch3>Cada detalle cuenta\u003c/h3>\u003csmall>Atiende las incidencias que necesitan una decisión.\u003c/small>\u003c/div>\u003ca href=\"#incidencias\" class=\"btn secondary small\">Revisar pendientes →\u003c/a>\u003c/div>${s.issues.filter(i=>i.status==='Pendiente').slice(0,3).map(i=>`\u003cdiv class=\"alert-row\">\u003cdiv class=\"row\">\u003cspan class=\"icon\" style=\"background:#fff6e8;color:#c09b55\">!\u003c/span>\u003cdiv>\u003cb>${esc(i.title)}\u003c/b>\u003csmall>${esc(MRH.employee(i.employee)?.name)} · ${esc(i.detail)}\u003c/small>\u003c/div>\u003c/div>\u003cbutton class=\"btn ghost small\" data-issue=\"${esc(i.id)}\">Revisar →\u003c/button>\u003c/div>`).join('')||'\u003cdiv class=\"empty\">Todo al día. No hay incidencias pendientes.\u003c/div>'}\u003c/section>\u003csection class=\"card\">\u003cdiv class=\"card-head\">\u003cdiv>\u003ch3>Últimos registros recibidos\u003c/h3>\u003csmall>Conservados por origen · Sin cambios silenciosos\u003c/small>\u003c/div>\u003ca href=\"#marcaciones\" style=\"font-size:11px;color:var(--blue)\">Ver todos →\u003c/a>\u003c/div>${eventsTable(received.slice(-5).reverse())}\u003c/section>`;wireIssues(c)}\nfunction eventsTable(events,actions=true){return table(['Empleado','Fecha / hora local','Evento','Terminal','Estado',...(actions?['']:[])],events.map(e=>`\u003ctr>\u003ctd>${person(e.employee)}\u003c/td>\u003ctd>${MRH.time(e.time)}\u003csmall style=\"display:block;font-size:9px;margin-top:5px\">${MRH.day(e.time)}\u003c/small>\u003c/td>\u003ctd>${esc(e.action)}\u003c/td>\u003ctd>${esc(e.device)}\u003c/td>\u003ctd>${pill(e.status)}\u003c/td>${actions?`\u003ctd>\u003cbutton class=\"btn ghost small\" data-event=\"${esc(e.id)}\">Detalle →\u003c/button>\u003c/td>`:''}\u003c/tr>`).join(''))}\nfunction wireEvents(c){c.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>eventDetail(b.dataset.event))}\nfunction eventDetail(id){const e=MRH.state.events.find(x=>x.id===id);modal('Detalle de la evidencia',`${person(e.employee)}\u003cdiv class=\"grid2\" style=\"margin-top:25px\">\u003cdiv class=\"field\">\u003clabel>Evento original\u003c/label>\u003cb>${esc(e.action)}\u003c/b>\u003c/div>\u003cdiv class=\"field\">\u003clabel>Estado demo\u003c/label>${pill(e.status)}\u003c/div>\u003cdiv class=\"field\">\u003clabel>Fecha / hora local CR\u003c/label>${MRH.day(e.time)} · ${MRH.time(e.time)}\u003c/div>\u003cdiv class=\"field\">\u003clabel>Terminal de origen\u003c/label>${esc(e.device)}\u003c/div>\u003c/div>\u003cdiv class=\"notice\">UUID: ${esc(e.id)}\u003cbr>Confianza: hora local del navegador, sin certificación de servidor.\u003cbr>Método: PIN de demostración. Fotografía: no capturada.\u003c/div>\u003cp class=\"muted\" style=\"font-size:12px;margin-top:18px\">El evento original no se edita. Las revisiones se añaden al historial de incidencias.\u003c/p>`)}\nfunction employees(c){c.innerHTML=head('El equipo que hace posible cada jornada.',`\u003cbutton class=\"btn\" id=\"add-employee\">＋ Nuevo empleado\u003c/button>`)+`\u003csection class=\"card\">\u003cdiv class=\"toolbar\">\u003clabel class=\"sr-only\" for=\"employee-query\">Buscar empleados\u003c/label>\u003cinput id=\"employee-query\" type=\"search\" class=\"input\" placeholder=\"Buscar por nombre, número o puesto…\">\u003clabel class=\"sr-only\" for=\"employee-branch\">Sucursal\u003c/label>\u003cselect id=\"employee-branch\" class=\"input\">\u003coption value=\"\">Todas las sucursales\u003c/option>${MRH.state.branches.map(b=>`\u003coption>${esc(b.name)}\u003c/option>`).join('')}\u003c/select>\u003clabel class=\"sr-only\" for=\"employee-status\">Estado\u003c/label>\u003cselect id=\"employee-status\" class=\"input\">\u003coption value=\"\">Todos los estados\u003c/o loyee\">${MRH.state.employees.filter(x=>x.active).map(e=>`\u003coption value=\"${e.id}\">${esc(e.name)}\u003c/option>`).join('')}\u003c/select>\u003c/div>${F('Fecha','date',MRH.date,'date','required')}${F('Horas solicitadas','hours','1','number','required min=\"0.25\" max=\"12\" step=\"0.25\"')}${F('Justificación','reason','','text','required minlength=\"5\" maxlength=\"250\"')}${buttonsSave('Registrar solicitud')}\u003c/form>`);wireCancel(m);m.querySelector('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(MRH.transaction(s=>{s.overtime??=[];s.overtime.push({...d,id:crypto.randomUUID(),status:'Pendiente'})})){MRH.audit('Solicitar horas extra',d.employee+' · '+d.hours+' h solicitadas');closeModal();render();toast('Solicitud registrada, sin horas ni pagos calculados.')}}};c.querySelectorAll('[data-overtime]').forEach(b=>b.onclick=()=>{const x=rows.find(x=>x.id===b.dataset.overtime);const m=modal('Revisión de horas extra',`${person(x.employee)}\u003cp style=\"margin-top:20px\">${esc(x.hours)} h solicitadas · ${esc(x.date)}\u003c/p>\u003cp class=\"muted\">${esc(x.reason)}\u003c/p>${x.status==='Pendiente'?`\u003cform>${S('Decisión','status',['Aprobada','Rechazada'])}${F('Motivo de la decisión','reviewReason','','text','required minlength=\"5\" maxlength=\"250\"')}${buttonsSave('Guardar decisión')}\u003c/form>`:`\u003cdiv class=\"notice\">${esc(x.status)} · ${esc(x.reviewReason)}\u003c/div>`}`);wireCancel(m);const f=m.querySelector('form');if(f)f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(MRH.transaction(s=>Object.assign(s.overtime.find(y=>y.id===x.id),d,{reviewedAt:new Date().toISOString()}))){MRH.audit('Revisar horas extra',x.id+' · '+d.status+' · '+d.reviewReason);closeModal();render();toast('Decisión guardada. Trabajo efectivo aún sin conciliar.')}}})}\nfunction prepay(c){const es=MRH.state.employees.filter(x=>x.active);c.innerHTML=head('Consolidación preliminar para revisión administrativa.',`\u003cbutton class=\"btn secondary\" id=\"prepay-csv\">↓ Exportar pendientes CSV\u003c/button>`)+`\u003cdiv class=\"notice warn\" style=\"margin-bottom:22px\">Cálculo incompleto: faltan historial salarial, contratos validados y jornadas conciliadas. No se estiman importes legales, aguinaldo ni deducciones.\u003c/div>\u003csection class=\"card\">\u003cdiv class=\"card-head\">\u003cdiv>\u003ch3>Preparación de preplanilla\u003c/h3>\u003csmall>Todos los registros recibidos de esta demo; sin liquidación de períodos.\u003c/small>\u003c/div>\u003cspan class=\"pill warn\">No liquidable\u003c/span>\u003c/div>${table(['Empleado','Registros recibidos','Horas ordinarias','Extras trabajadas','Importe','Estado'],es.map(e=>`\u003ctr>\u003ctd>${person(e.id)}\u003c/td>\u003ctd>${MRH.state.events.filter(x=>x.employee===e.id&&x.status!=='Pendiente').length}\u003c/td>\u003ctd>Por conciliar\u003c/td>\u003ctd>No determinadas\u003c/td>\u003ctd>—\u003c/td>\u003ctd>${pill('Pendiente')}\u003c/td>\u003c/tr>`).join(''))}\u003c/section>\u003csection class=\"card\" style=\"margin-top:22px\">\u003ch3>Antes de calcular\u003c/h3>\u003cdiv class=\"grid3\" style=\"margin-top:20px\">\u003cdiv class=\"notice\">01 · Revisar eventos originales e incidencias por sucursal.\u003c/div>\u003cdiv class=\"notice\">02 · Validar contratos, remuneraciones y reglas laborales versionadas.\u003c/div>\u003cdiv class=\"notice\">03 · Aprobar la conciliación y revisar la propuesta de pago.\u003c/div>\u003c/div>\u003c/section>`;c.querySelector('#prepay-csv').onclick=()=>{MRH.download('markarh-preplanilla-incompleta-demo.csv',MRH.csv([['Empleado','Registros recibidos','Horas','Importe','Estado'],...es.map(e=>[e.name,MRH.state.events.filter(x=>x.employee===e.id&&x.status!=='Pendiente').length,'Por conciliar','No calculado','Cálculo incompleto - datos demo'])]),'text/csv;charset=utf-8');MRH.audit('Exportar preplanilla','Datos incompletos; sin importes calculados');toast('Pendientes exportados. No se generó una planilla de pago.')}}\nwindow.addEventListener('hashchange',()=>{if(!role)return;const next=location.hash.slice(1);if(next===view)return;view=next;shell()});window.addEventListener('mrh-update',()=>{if(role&&!document.querySelector('.modal-backdrop'))render()});if(role&& !['company','master'].includes(role)){role=null;sessionStorage.removeItem('mrh-role')}shell();\n\n\u003c/script>\u003c/body>\u003c/html>\n"};const page=new URLSearchParams(location.search).get("page")||"web";document.open();document.write(pages[page]||pages.web);document.close();</script></html>
